<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مكتبة الأفلام | AZZ LOGISTICS</title><style>body{margin:0;background:#07172c;color:#eef5ff;font:16px Tahoma,Arial,sans-serif}header,main,footer{max-width:1000px;margin:auto;padding:25px}a{color:#e3b95d}h1,h2{color:#e3b95d}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}.card{background:#102b4a;border:1px solid #e3b95d55;border-radius:16px;padding:20px;line-height:1.9}button{background:#e3b95d;border:0;border-radius:9px;padding:10px;cursor:pointer}input{width:100%;box-sizing:border-box;padding:14px;border-radius:10px;background:#fff;color:#111;border:0;margin-bottom:18px}small{color:#bac8dc}</style></head><body><header><a href="./index.html">← الرئيسية</a><h1>🎬 مكتبة عز اللوجستية</h1><p>من الميناء للمستودع، كل مشهد وراه قصة لوجستية تستاهل تعرفها.</p></header><main><label for="search">ابحث عن مجال</label><input id="search" placeholder="مثلا الموانئ أو الشحن"><div class="grid" id="library"></div><p><small>المكتبة تعرض روابط بحث لمقاطع تعليمية لدى أصحابها. لا يتم نسخ فيديوهات أو إعادة نشرها بدون إذن.</small></p></main><footer>AZZ LOGISTICS | عبدالعزيز مجلي</footer><script>const items=[['الموانئ السعودية','اكتشف كيف تتحرك الحاويات وتدخل البضائع من البحر','Saudi ports logistics educational'],['الشحن الجوي','ليش الشحن الجوي أسرع وكيف تشتغل المناولة بالمطار','air cargo operations educational'],['إدارة المستودعات','من الاستلام إلى التخزين ثم التجهيز للشحن','warehouse operations educational'],['سلاسل الإمداد','وش يصير من المصنع لين يوصل المنتج لبيتك','supply chain explained Arabic'],['النقل البري','الرحلة اللي تقطعها الشاحنات بين المدن','truck logistics operations educational'],['التخليص الجمركي','وش خطوات فسح البضاعة قبل دخول السوق','customs clearance process Saudi educational']];const root=document.getElementById('library');function render(q=''){root.replaceChildren();let matches=items.filter(x=>x.join(' ').toLowerCase().includes(q.toLowerCase()));for(const [name,desc,query] of matches){const card=document.createElement('article');card.className='card';const title=document.createElement('h2');title.textContent=name;const p=document.createElement('p');p.textContent=desc;const a=document.createElement('a');a.href='https://www.youtube.com/results?search_query='+encodeURIComponent(query);a.target='_blank';a.rel='noopener noreferrer';a.textContent='استكشف المقاطع ↗';card.append(title,p,a);root.append(card)}if(!matches.length)root.textContent='ما لقينا نتيجة، جرب كلمة ثانية.'}document.getElementById('search').addEventListener('input',e=>render(e.target.value));render();</script></body></html>
