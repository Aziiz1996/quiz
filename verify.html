<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>توثيق الجوال | عز لوجستيك</title><style>body{background:#07172c;color:#eef5ff;font-family:Tahoma,Arial;margin:0;display:grid;place-items:center;min-height:100vh}main{padding:25px;background:#102b4a;border:1px solid #e3b95d;border-radius:18px;width:min(88vw,450px)}h1,a{color:#e3b95d}input,button{padding:12px;margin:9px 0;box-sizing:border-box;width:100%;border-radius:8px;font-size:17px}button{background:#e3b95d;border:0;cursor:pointer}#check{display:none}</style><main><h1>AZZ LOGISTICS</h1><h2>توثيق رقم الجوال</h2><p>التوثيق لا يمنحك صلاحية الدخول لمحتوى الطلاب قبل موافقة الإدارة</p><form id="start"><input id="phone" type="tel" required placeholder="+966512345678" pattern="\+[1-9][0-9]{7,14}"><button>إرسال الرمز</button></form><form id="check"><input id="code" required inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{4,10}" placeholder="رمز التحقق"><button>تأكيد الرمز</button></form><p id="status" role="status"></p><a href="./">العودة للرئيسية</a></main><script>
const API=''; // Add trusted HTTPS Render backend URL only after deployment.
const byId=id=>document.getElementById(id),status=byId('status');
async function call(path,data){if(!API)throw Error('الخدمة غير مفعّلة حتى إعداد خادم التحقق');const response=await fetch(API+path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});const body=await response.json();if(!response.ok)throw Error(body.error||'حدث خطأ');return body}
byId('start').onsubmit=async e=>{e.preventDefault();try{await call('/api/verify/start',{phone:byId('phone').value.trim()});byId('check').style.display='block';status.textContent='تم طلب إرسال الرمز'}catch(err){status.textContent=err.message}};
byId('check').onsubmit=async e=>{e.preventDefault();try{const data=await call('/api/verify/check',{phone:byId('phone').value.trim(),code:byId('code').value.trim()});status.textContent=data.verified?'تم توثيق رقمك. اعتماد الطالب يتطلب موافقة الإدارة.':'الرمز غير صحيح أو منتهي'}catch(err){status.textContent=err.message}};
</script></html>
