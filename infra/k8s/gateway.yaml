# Requires an installed Gateway API controller and its CRDs.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: azz-gateway
spec:
  gatewayClassName: REPLACE_WITH_INSTALLED_GATEWAY_CLASS
  listeners:
    - name: https
      protocol: HTTPS
      port: 443
      hostname: analytics.example.com
      tls:
        mode: Terminate
        certificateRefs: [{name: azz-tls}]
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: azz-analytics-route
spec:
  parentRefs: [{name: azz-gateway}]
  hostnames: [analytics.example.com]
  rules:
    - matches:
        - path: {type: PathPrefix, value: /}
      backendRefs: [{name: azz-analytics, port: 80}]
